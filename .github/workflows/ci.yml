name: OptiChain AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run full multi-seed benchmark scripts (slow)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system solver (COIN-OR CBC)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coinor-cbc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage Enforcement
        run: |
          pytest --cov=optichain --cov-report=xml --cov-fail-under=85 tests

      - name: Optional Benchmark Execution
        if: ${{ github.event.inputs.run_benchmarks == 'true' }}
        run: |
          python scripts/audit_optimization.py

  frontend-build:
    name: Frontend Dependency Audit & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies (Lockfile Enforced)
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: ./frontend
        run: npm run build
